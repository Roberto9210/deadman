[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deadman"
version = "0.1.0.dev0"
description = "Execution-safety primitives for automated trading systems: kill switch, persistent entry halt, units contract, honest post-fill, signed ledger."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pynacl>=1.5"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["deadman*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deadman-kit"          # PyPI distribution name ("deadman" is taken); the import stays `deadman`
version = "0.3.0"
description = "Execution-safety primitives for automated trading systems: kill switch, persistent entry halt, units contract, honest post-fill state machine, hash-chained ledger anchorable to a third party by a publisher you supply. Zero runtime dependencies."
readme = "README.md"
# Floor 3.10, and why: PEP 604 unions (`X | None`) are used at runtime in
# signatures throughout the package; `sys.stdlib_module_names` (used by the
# zero-dependency conformance test) exists since 3.10. Nothing here needs
# anything newer. Tested on 3.10-3.14 in CI.
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Roberto9210" }]
keywords = ["trading", "safety", "kill-switch", "ledger", "fail-closed", "execution"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
# ZERO runtime dependencies by design (SPEC §2b). Proven, not stated:
# tests/test_g12_clock_and_paths.py::test_package_imports_only_stdlib_and_itself
# scans every import, and CI installs the built wheel into a clean venv with
# --no-deps and runs an import + minimal execution.
dependencies = []

[project.optional-dependencies]
# `build` is a TEST dependency, not a packaging convenience: tests/test_wheel_contents.py
# builds the wheel and opens it, because "it ships" has been true of this repository and
# false of the package twice. A test that skipped when the backend was missing would
# report nothing and read as a pass.
test = ["pytest>=8", "build>=1"]
# Optional, and ONLY for verifying a certificate's Ed25519 signature (L3). The base package
# keeps zero runtime dependencies: `dependencies = []` above is unchanged, and the verifier
# reaches this through importlib so the stdlib-only AST scan still passes. Without the extra
# it reports the signature as NOT_VERIFIED and degrades to L2 - never to "valid".
verify-sig = ["cryptography>=42"]

[project.urls]
Homepage = "https://github.com/Roberto9210/deadman"
# Two specifications, and they are not the same document. `Specification` is the KIT's - the
# primitives. `Certificate specification` covers the certificate and the verifier that judges
# it. Until 2026-09-03 only the first was listed, so a reader looking for the certificate's
# rules either found the wrong document or concluded there was none.
Specification = "https://github.com/Roberto9210/deadman/blob/main/docs/SPEC.md"
"Certificate specification" = "https://github.com/Roberto9210/deadman/blob/main/deadman/docs/CERT_SPEC.md"
Changelog = "https://github.com/Roberto9210/deadman/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["deadman*"]
exclude = ["tests*", "examples*"]

[tool.setuptools.package-data]
# WHAT PUTS A FILE IN THE WHEEL IS ITS LOCATION, NOT THIS BLOCK. Measured 2026-09-03: the built
# wheel is identical with this block, without the CERT_SPEC entry, and with the whole block
# deleted - 29 entries and the same contents in all three. `include-package-data` is on by default
# under pyproject.toml and picks these up because they sit under `deadman/`.
#
# The block is kept anyway, and the reason is honest rather than confident: that measurement used
# ONE setuptools on ONE machine, and this project builds on three platforms. A declaration inert
# here may not be inert everywhere, and removing it to tidy up would trade a proven-harmless line
# for an unmeasured risk. What GUARANTEES the outcome is tests/test_wheel_contents.py, which
# builds the wheel and opens it wherever CI runs.
#
# What the two entries are, and why they belong to the reader rather than to us:
#   examples/  until 0.2.1 they lived at the repo ROOT, the README said they "ship", and the wheel
#              contained none of them. What fixed it was MOVING THEM under `deadman/`; the globs
#              added at the same time got the credit and did nothing.
#   docs/      `verify_certificate.py` cites CERT_SPEC fifteen times and until 2026-09-03 the
#              wheel had no `docs/` at all - writing the document closed the gap for someone with
#              a git clone and closed nothing for the installer. Same defect, same fix.
# `--example` and `--spec` read these files, so neither is decoration.
deadman = ["py.typed", "examples/certificate/*.json", "examples/certificate/*.jsonl",
           "examples/certificate/*.md", "examples/certificate/*.py",
           "docs/CERT_SPEC.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

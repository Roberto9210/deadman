name: deadman

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
  workflow_call:      # reused as-is by release.yml: a release runs the SAME suite as CI

jobs:
  test:
    # Windows is NOT optional: the msvcrt.LK_NBLCK finding (LK_LOCK gives up
    # after 10 internal retries with an OSError that is not a PermissionError)
    # is a claim only a Windows run keeps honest. Real-process tests (G9 kill
    # mid-send, G11 two writers) run here unmarked; nothing is slow-skipped.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test deps only (the package itself has none)
        # THE EXTRAS ARE INSTALLED BY NAME, NOT RE-LISTED BY HAND. This line used to spell out
        # `pytest cryptography`, which was the same set pyproject declared until it was not:
        # `test` gained `build>=1` for tests/test_wheel_contents.py, this line did not, and
        # three tests errored on all nine cells the first time the tag was pushed. A dependency
        # list kept in two places is a claim kept in two places, and only one of them is read
        # by pip. Now there is one.
        #
        # cryptography arrives through [verify-sig]. It is a TEST dependency here, not a runtime
        # one, and without it the three signature tests importorskip and the suite reports 4
        # skips instead of the 1 documented platform skip. Installed so the signature path is
        # genuinely exercised on every OS and Python in the matrix.
        #
        # `-e` on purpose: the suite must run against the checkout, not against a copy of it in
        # site-packages, and it is also the shape the working machines use - so a control run by
        # scripts/check_against_old.py behaves the same here as it does there.
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test,verify-sig]"
      - name: Full suite (every skip must be visible with its reason)
        # -rs prints the reasons. Two are expected here: the design skip in G5, and the
        # certificate case that runs only where a live guardian ledger exists - that file is a
        # trader's session data and is deliberately not vendored into a public repository.
        run: python -m pytest -q -rs tests

  wheel:
    # "Zero dependencies" needs proof like everything else: build the wheel,
    # install it into a CLEAN venv with --no-deps, import, run a minimal flow.
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Clean venv install and smoke run
        shell: bash
        run: |
          WHEEL="$(ls "$PWD"/dist/deadman_kit-*.whl)"   # distribution deadman-kit, import deadman
          python -m venv "$RUNNER_TEMP/cleanvenv"
          if [ -f "$RUNNER_TEMP/cleanvenv/bin/python" ]; then PY="$RUNNER_TEMP/cleanvenv/bin/python"; else PY="$RUNNER_TEMP/cleanvenv/Scripts/python.exe"; fi
          "$PY" -m pip install --no-deps "$WHEEL"
          "$PY" -m pip check
          # NEUTRAL cwd: from the repo root the source tree ./deadman shadows the installed
          # package (cwd is on sys.path) and the smoke would "pass" without testing the wheel.
          cd "$RUNNER_TEMP"
          "$PY" -c "import deadman, sys; print(deadman.__version__, deadman.__file__); assert 'site-packages' in deadman.__file__, deadman.__file__"
          "$PY" - <<'EOF'
          import sys, tempfile
          from deadman import *
          root = tempfile.mkdtemp()
          clock = FakeClock(); paths = Paths(root); ident = WriterIdentity(clock, pid=1)
          ledger = Ledger(paths, clock, publisher=lambda d: "ref")
          kill = KillSwitch(paths, ledger); halt = EntryHalt(paths, clock, ident, ledger)
          assert kill.check().allowed and halt.active() is None
          halt.set("smoke", "ci"); assert halt.active() is not None
          r = resolve_units(Intent("BTC/USD", "buy", "USD", 10.0, "ENTRY", "smoke"), 100.0)
          assert abs(r.amount_base - 0.1) < 1e-12
          rep = ledger.verify(); assert rep.ok and rep.chain_complete
          mods = {m.split('.')[0] for m in list(sys.modules) if not m.startswith('_')}
          third = [m for m in mods if m not in sys.stdlib_module_names and m != 'deadman' and not m.startswith('encodings')]
          assert third == [], third
          print("smoke ok: entries", rep.entries_checked, "anchors", rep.anchors_checked, "non-stdlib modules:", third)
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: deadman-dist-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  line-endings:
    # Not "is the repo uniform" - it is not, and that proxy was believed while being false for a
    # year (see .gitattributes). This measures the damage itself: a change that rewrote a file's
    # line endings, which turns a one-line edit into a whole-file diff and moves that file's git
    # blame onto the editing commit. Ubuntu only: it reads git, not the platform.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the check needs the BEFORE side of the diff
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Endings unchanged in every modified file
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no usable base ref (first push, or a force-push); nothing to compare"
            exit 0
          fi
          python scripts/check_line_endings.py "$BASE" "${{ github.sha }}"
